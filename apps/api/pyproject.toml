[project]
name = "taskqueue-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "argon2-cffi>=23.1",
    "prometheus-client>=0.21",
    "python-ulid>=2.0",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-flask>=1.3",
    "fakeredis[lua]>=2.23",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101", "S104", "B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["src/worker/celery_app.py", "migrations/*"]
